[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geniface"
version = "0.1.0"
description = "Contract-first adapters for turning Python functions into portable interfaces."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "fastapi", "httpx", "python-multipart"]

[tool.setuptools.packages.find]
include = ["geniface", "geniface.*"]

[tool.setuptools.package-data]
"geniface.templates" = ["*.tmpl"]
